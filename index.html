<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Westlake Elite // v2.4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #090e17; 
            --glass: rgba(18, 30, 49, 0.55); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e6edf8;
            --primary: #5c8dd6; 
            --accent: #8ea1c0; 
            --error: #ffb4ab; 
            --radius: 3vh;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            position: relative;
        }

        /* BACKGROUND GLOW ANIMATION EFFECTS */
        body::before {
            content: '';
            position: absolute;
            top: -20vh;
            left: -10vw;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(92, 141, 214, 0.12) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -20vh;
            right: -10vw;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(142, 180, 242, 0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 14s infinite alternate ease-in-out reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(3vw, -2vh); opacity: 1; }
        }

        /* ENTRANCE ANIMATIONS */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* HEADER */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 2vh 5vh; 
            height: 18vh; 
            position: relative; 
            z-index: 1;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .h-time { 
            font-size: 9vh; 
            font-weight: 200; 
            line-height: 0.8; 
            letter-spacing: -2px; 
            color: #ffffff; 
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, text-shadow 0.3s ease;
        }
        .h-time:hover {
            transform: scale(1.02);
            text-shadow: 0 0 30px rgba(92, 141, 214, 0.5);
        }
        .h-brand { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
        
        /* LOGO STYLING */
        .h-brand img { 
            height: 12.5vh; 
            width: auto; 
            max-width: 40vw;
            object-fit: contain; 
            filter: brightness(0) invert(1) drop-shadow(0 0 14px rgba(92, 141, 214, 0.65)); 
            transition: filter 0.4s ease, transform 0.4s ease;
        }
        .h-brand img:hover {
            filter: brightness(0) invert(1) drop-shadow(0 0 22px rgba(92, 141, 214, 0.95));
            transform: scale(1.03);
        }
        .h-brand p { font-size: 1.1vh; opacity: 0.5; letter-spacing: 2px; margin-top: 0.5vh; color: var(--accent); }

        /* LAYOUT */
        .container { 
            display: flex; 
            flex: 1; 
            padding: 0 4vh 4vh 4vh; 
            gap: 3vh; 
            min-height: 0; 
            position: relative; 
            z-index: 1;
        }
        aside { 
            flex: 0 0 32vw; 
            display: flex; 
            flex-direction: column; 
            gap: 3vh; 
            animation: fadeInLeft 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        main { 
            flex: 1; 
            display: flex; 
            border-radius: var(--radius); 
            overflow: hidden; 
            background: #000; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            position: relative; 
            animation: scaleIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        main:hover {
            border-color: rgba(92, 141, 214, 0.3);
            box-shadow: 0 20px 45px rgba(0,0,0,0.7), 0 0 25px rgba(92, 141, 214, 0.15);
        }

        /* LOCKDOWN BROWSER FULLSCREEN FALLBACK (OVERLAY MODE) */
        main.maximized {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* GLASS CARDS */
        .card { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            border-radius: var(--radius); 
            padding: 3vh; 
            display: flex; 
            flex-direction: column; 
            min-height: 0; 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }
        .label { font-size: 1.1vh; font-weight: 600; color: var(--accent); margin-bottom: 2vh; letter-spacing: 0.2vh; text-transform: uppercase; }

        /* BUTTONS */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vh; margin-bottom: 2vh; }
        .btn { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid var(--glass-border); 
            color: #fff; 
            padding: 1.8vh; 
            border-radius: 1.5vh; 
            font-size: 1.5vh; 
            font-weight: 400; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
            text-align: center; 
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { 
            background: rgba(92, 141, 214, 0.2); 
            border-color: rgba(92, 141, 214, 0.5); 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 12px rgba(92, 141, 214, 0.2);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-active { 
            background: var(--primary) !important; 
            color: #000 !important; 
            font-weight: 600; 
            box-shadow: 0 4px 15px rgba(92, 141, 214, 0.4);
        }

        /* TACTICAL TRIGGERS GRID */
        .emer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vh; }
        .btn-e { 
            background: rgba(255,180,171,0.05); 
            border: 1px solid rgba(255,180,171,0.2); 
            color: var(--error); 
            padding: 1.2vh 0.5vh; 
            border-radius: 1vh; 
            font-size: 1.1vh; 
            font-weight: 500; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: all 0.25s ease;
        }
        .btn-e:hover { 
            background: rgba(255,180,171,0.25); 
            border-color: rgba(255,180,171,0.5);
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(255, 180, 171, 0.2);
        }
        .btn-e:active {
            transform: scale(0.96);
        }

        /* REGISTRY */
        #reg-list { 
            overflow-y: auto; 
            flex: 1; 
            scrollbar-width: none; 
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%); 
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .reg-item { 
            padding: 1.5vh 0; 
            border-bottom: 1px solid var(--glass-border); 
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: background 0.2s ease, padding-left 0.2s ease;
        }
        .reg-item:hover {
            background: rgba(255, 255, 255, 0.02);
            padding-left: 8px;
        }
        .reg-item .meta { font-size: 1vh; color: var(--accent); margin-bottom: 0.5vh; text-transform: uppercase; }
        .reg-item .body { font-size: 1.8vh; font-weight: 300; color: #fff; }

        /* ALARM SYSTEM OVERLAY WITH FLEXBOX STABILITY */
        .siren-ui { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 10000; 
            background: rgba(0, 0, 0, 0.96); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            opacity: 0;
            transition: opacity 0.4s ease;
            box-sizing: border-box;
            padding: 6vh 4vw;
        }
        .siren-ui.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 1;
        }

        /* TOP PINNED LOGO */
        .siren-logo {
            height: 20vh;
            width: auto;
            max-width: 80vw;
            object-fit: contain;
            filter: brightness(0) invert(1) drop-shadow(0 0 30px rgba(92, 141, 214, 0.95));
            flex-shrink: 0;
        }

        /* DEAD CENTER PULSATING TEXT ONLY */
        .siren-title-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            padding: 0 2vw;
        }

        .siren-title-container h1 { 
            font-size: 9.5vh; 
            font-weight: 200; 
            letter-spacing: -1px; 
            line-height: 1.1;
            color: var(--error);
            text-shadow: 0 0 35px rgba(255, 180, 171, 0.7);
            animation: textPulse 1.2s infinite alternate ease-in-out;
            margin: 0;
            will-change: transform, opacity;
        }

        @keyframes textPulse { 
            0% { 
                transform: scale(0.96); 
                opacity: 0.8;
                text-shadow: 0 0 20px rgba(255, 180, 171, 0.4);
            } 
            100% { 
                transform: scale(1.05); 
                opacity: 1;
                text-shadow: 0 0 50px rgba(255, 180, 171, 1);
            } 
        }

        /* BOTTOM PINNED STATIC DISMISS BUTTON */
        .siren-dismiss-btn {
            flex-shrink: 0;
            padding: 2.2vh 8vh; 
            font-size: 2vh; 
            font-weight: 500;
            border-radius: 5vh; 
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            margin-bottom: 2vh;
        }
        .siren-dismiss-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .siren-dismiss-btn:active {
            transform: translateY(1px);
        }

        /* FULLSCREEN CALENDAR OVERLAY & BACK BUTTON */
        main:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; }
        main:-webkit-full-screen { width: 100vw; height: 100vh; border-radius: 0; border: none; }

        .cal-back-btn {
            display: none;
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 999999;
            background: rgba(142, 180, 242, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #0b1326;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeInDown 0.4s ease;
        }

        .cal-back-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(142, 180, 242, 0.6);
        }
        .cal-back-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* SHOW BACK BUTTON IN NATIVE FULLSCREEN OR OVERLAY MAXIMIZED MODE */
        main:fullscreen .cal-back-btn,
        main:-webkit-full-screen .cal-back-btn,
        main.maximized .cal-back-btn {
            display: block;
        }

        iframe { width: 100%; height: 100%; border: none; filter: invert(92%) hue-rotate(180deg) contrast(1.1); transition: opacity 0.5s ease; }
    </style>
</head>
<body>

    <header>
        <div class="h-time" id="ht">00:00</div>
        <div class="h-brand">
            <img src="https://ik.imagekit.io/WestlakeElite/logos/16_9-transparent.png" alt="Westlake Elite">
            <p>COMMAND INTERFACE v2.4</p>
        </div>
    </header>

    <div class="container">
        <aside>
            <div class="card">
                <p class="label">System Hub</p>
                <div class="btn-grid">
                    <button class="btn btn-active" onclick="window.location.href='spotify:search'">Spotify</button>
                    <button class="btn" onclick="window.location.href='https://alexa.amazon.com'">Alexa</button>
                </div>
                <div class="btn-grid">
                    <button class="btn" onclick="toggleVoice()">Voice Announce</button>
                    <button class="btn" onclick="manualBroadcast()">Type Alert</button>
                </div>
                <div class="btn-grid" style="margin-bottom: 2vh;">
                    <button class="btn" style="grid-column: span 2;" onclick="toggleCalendarFullscreen()">Calendar</button>
                </div>
                
                <p class="label">Tactical Triggers</p>
                <div class="emer-grid">
                    <button class="btn-e" onclick="triggerSiren('POLICE')">Police</button>
                    <button class="btn-e" onclick="triggerSiren('FIRE')">Fire</button>
                    <button class="btn-e" onclick="triggerSiren('MEDICAL')">Medical</button>
                    <button class="btn-e" onclick="triggerSiren('INTRUDER')">Intruder</button>
                    <button class="btn-e" style="color:#fce99a; border-color:rgba(252,233,154,0.2)" onclick="triggerSiren('WEATHER')">Weather</button>
                    <button class="btn-e" style="color:#d0bcff; border-color:rgba(208,188,255,0.2)" onclick="triggerSiren('POWER_OUTAGE')">Power Outage</button>
                    <button class="btn-e" style="grid-column: span 2; background:#fff; color:#000;" onclick="stopSiren()">Clear</button>
                </div>
            </div>

            <div class="card" style="padding: 2vh 3vh;">
                <p class="label">Dishes Assignment</p>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="dish-name" style="font-size: 4vh; font-weight: 200; transition: all 0.3s ease;">---</span>
                    <button class="btn" style="padding: 1.2vh 2.5vh; font-size: 1.2vh; margin-bottom: 0;" onclick="nextRotation()">Complete</button>
                </div>
            </div>

            <div class="card" style="flex: 1; min-height: 0;">
                <p class="label">Registry & History</p>
                <div id="reg-list"></div>
            </div>
        </aside>

        <main id="calendar-container">
            <button class="cal-back-btn" onclick="exitCalendarFullscreen()">← Back to Dashboard</button>
            <iframe src="https://calendar.google.com/calendar/embed?src=family14661226943060601464%40group.calendar.google.com&ctz=America%2FNew_York&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23ffffff"></iframe>
        </main>
    </div>

    <!-- ALARM OVERLAY WITH LOGO HIGH UP, CENTERED PULSATING TITLE & STABLE DISMISS BUTTON -->
    <div id="siren-ui" class="siren-ui">
        <img src="https://ik.imagekit.io/WestlakeElite/logos/16_9-transparent.png" alt="Westlake Elite" class="siren-logo">
        <div class="siren-title-container">
            <h1 id="siren-msg">EMERGENCY</h1>
        </div>
        <button class="siren-dismiss-btn" onclick="stopSiren()">System Secure</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, getDoc, collection, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDn3fqrdVcRnvkiX7t6TPJWrngXSrM_1p4", projectId: "my-a-ab8f3", appId: "1:65984042323:web:04a6ebadc4eb29d52c3da6" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ALARM AUDIO LINKS MAPPING
        const alarmSounds = {
            'WEATHER': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Weather%20Alarm.m4a',
            'POLICE': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Police%20Alarm.m4a',
            'INTRUDER': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Intruder%20Alarm.m4a',
            'MEDICAL': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Medical%20Alarm.m4a',
            'FIRE': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Fire%20Alarm.m4a',
            'POWER_OUTAGE': 'https://ik.imagekit.io/WestlakeElite/ALARMS/Minor%20Power%20Outages.m4a'
        };

        const alarmTitles = {
            'WEATHER': 'WEATHER ALERT',
            'POLICE': 'POLICE EMERGENCY',
            'INTRUDER': 'INTRUDER ALERT',
            'MEDICAL': 'MEDICAL EMERGENCY',
            'FIRE': 'FIRE ALARM',
            'POWER_OUTAGE': 'MINOR POWER OUTAGE'
        };

        let currentAudio = null;

        // HYBRID FULLSCREEN & LOCKDOWN BROWSER FALLBACK
        window.toggleCalendarFullscreen = () => {
            const calContainer = document.getElementById('calendar-container');
            
            if (document.fullscreenElement || document.webkitFullscreenElement || calContainer.classList.contains('maximized')) {
                window.exitCalendarFullscreen();
                return;
            }

            let req = calContainer.requestFullscreen || calContainer.webkitRequestFullscreen;
            if (req) {
                req.call(calContainer).catch(() => {
                    calContainer.classList.add('maximized');
                });
            } else {
                calContainer.classList.add('maximized');
            }
        };

        window.exitCalendarFullscreen = () => {
            const calContainer = document.getElementById('calendar-container');
            calContainer.classList.remove('maximized');

            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        };

        // DNS REWRITE HIJACK
        const currentHost = window.location.hostname;
        if (currentHost.includes('badsites.com') || currentHost === 'badsites.com') {
            window.location.href = "https://loganwestlake.github.io/westlake/blockpage/";
        }

        // SYNC WITH PHONE
        onSnapshot(doc(db, "system_triggers", "current_alert"), (snap) => {
            if (snap.exists()) {
                const d = snap.data();
                if(d.active) triggerSiren(d.type);
                if(d.cancel) stopSiren();
            }
        });

        function broadcast(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        window.manualBroadcast = () => { 
            const m = prompt("Enter Custom Alert:"); 
            if(m) { broadcast(m); addEntry("MANUAL", m); }
        };

        window.triggerSiren = (type) => {
            stopSiren(); // Reset any existing sound/speech first
            
            const sUI = document.getElementById('siren-ui');
            sUI.classList.add('active');
            
            const displayTitle = alarmTitles[type] || type;
            document.getElementById('siren-msg').innerText = displayTitle;

            const soundUrl = alarmSounds[type];
            if (soundUrl) {
                currentAudio = new Audio(soundUrl);
                currentAudio.loop = true;
                currentAudio.play().catch(e => console.log("Audio playback error:", e));
            }
        };

        window.stopSiren = () => { 
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            const sUI = document.getElementById('siren-ui');
            sUI.classList.remove('active');
            window.speechSynthesis.cancel(); 
        };

        const rota = ["BRIAN", "LOGAN", "MALAKI"];
        onSnapshot(doc(db, "settings", "dishes"), (s) => { 
            if(s.exists()) {
                const nameEl = document.getElementById('dish-name');
                nameEl.style.opacity = '0';
                nameEl.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    nameEl.innerText = rota[s.data().index];
                    nameEl.style.opacity = '1';
                    nameEl.style.transform = 'translateY(0)';
                }, 150);
            } 
        });

        window.nextRotation = async () => {
            const s = await getDoc(doc(db, "settings", "dishes"));
            await updateDoc(doc(db, "settings", "dishes"), { index: (s.data().index + 1) % 3 });
        };

        onSnapshot(query(collection(db, "houseInfo"), orderBy("createdAt", "desc")), (s) => {
            const list = document.getElementById('reg-list'); list.innerHTML = "";
            let delay = 0;
            s.forEach(d => {
                const item = document.createElement('div'); item.className = 'reg-item';
                item.style.animationDelay = `${delay}s`;
                item.innerHTML = `<div class="meta">${d.data().title}</div><div class="body">${d.data().text}</div>`;
                list.appendChild(item);
                delay += 0.05;
            });
        });

        async function addEntry(title, text) {
            await addDoc(collection(db, "houseInfo"), { title: title, text: text, createdAt: serverTimestamp() });
        }

        setInterval(() => { document.getElementById('ht').innerText = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }); }, 1000);
    </script>
</body>
</html>
