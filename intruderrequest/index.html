<body style="background:#000;color:#fff;font:bold 6vw sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const db = getFirestore(initializeApp({ apiKey: "AIzaSyDn3fqrdVcRnvkiX7t6TPJWrngXSrM_1p4", projectId: "my-a-ab8f3", appId: "1:65984042323:web:04a6ebadc4eb29d52c3da6" }));
const msg = document.getElementById('msg');
setDoc(doc(db, "system_triggers", "current_alert"), { type: "INTRUDER", active: true, cancel: false, timestamp: Date.now() })
  .then(() => { msg.textContent = "INTRUDER SENT ✓"; })
  .catch(e => { msg.textContent = "FAILED: " + e.message; });
</script>
</body></html>
