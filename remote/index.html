<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Westlake Remote // v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #090e17; 
            --glass: rgba(18, 30, 49, 0.55); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #5c8dd6; 
            --accent: #8ea1c0; 
            --error: #ffb4ab; 
            --warning: #fce99a;
            --text-main: #e6edf8;
        }
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Inter', sans-serif; 
        }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 15px 20px 30px 20px; 
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* BACKGROUND GLOW ANIMATION EFFECTS */
        body::before {
            content: '';
            position: absolute;
            top: -10vh;
            left: 50%;
            transform: translateX(-50%);
            width: 70vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(92, 141, 214, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* HEADER */
        header { 
            margin-top: 0;
            margin-bottom: 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .header-logo {
            width: 100%;
            max-width: 180px;
            height: auto;
            object-fit: contain;
            filter: brightness(0) invert(1) drop-shadow(0 0 15px rgba(92, 141, 214, 0.6));
            display: block;
        }

        /* SECTIONS */
        .section { margin-bottom: 25px; position: relative; z-index: 1; }
        .label { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--accent); 
            margin-bottom: 12px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: block; 
        }

        /* GLASS INPUT */
        input { 
            width: 100%; 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            color: #fff; 
            padding: 18px 20px; 
            border-radius: 16px; 
            font-size: 15px; 
            font-weight: 300; 
            margin-bottom: 12px; 
            outline: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input:focus {
            border-color: rgba(92, 141, 214, 0.5);
            box-shadow: 0 0 15px rgba(92, 141, 214, 0.2);
        }

        /* BUTTONS */
        .btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid var(--glass-border); 
            font-weight: 500; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
            background: rgba(255, 255, 255, 0.04); 
            color: #fff;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .btn:active { transform: scale(0.97); }
        .btn-main { 
            background: var(--primary); 
            color: #000; 
            border: none; 
            font-weight: 600; 
            box-shadow: 0 4px 15px rgba(92, 141, 214, 0.3);
        }
        .btn-sec { 
            background: transparent; 
            border-color: var(--glass-border); 
            color: #fff; 
            font-weight: 400; 
        }

        /* TACTICAL TRIGGERS GRID */
        .emer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-e { 
            background: rgba(255,180,171,0.05); 
            border: 1px solid rgba(255,180,171,0.2); 
            color: var(--error); 
            padding: 14px; 
            border-radius: 14px; 
            font-size: 12px; 
            font-weight: 500; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-e:active { transform: scale(0.96); background: rgba(255,180,171,0.25); }
        .btn-cancel { 
            grid-column: span 2; 
            background: #ffffff; 
            color: #000000; 
            font-weight: 700; 
            border: none; 
            margin-top: 5px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        /* DISHES SYNC */
        .dish-box { 
            background: var(--glass); 
            border: 1px solid var(--glass-border); 
            padding: 16px 20px; 
            border-radius: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        #dish-display { font-size: 22px; font-weight: 200; color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <img src="https://ik.imagekit.io/WestlakeElite/logos/transparent-logo.png?updatedAt=1787701939820" alt="Westlake Elite Logo" class="header-logo">
    </header>

    <div class="section">
        <span class="label">System Announcement</span>
        <input type="text" id="announceInput" placeholder="Enter message for TV...">
        <button class="btn btn-main" onclick="sendRemoteAlert()">EXECUTE BROADCAST</button>
    </div>

    <div class="section">
        <span class="label">Tactical Triggers</span>
        <div class="emer-grid">
            <button class="btn-e" onclick="triggerRemoteSiren('POLICE')">Police</button>
            <button class="btn-e" onclick="triggerRemoteSiren('FIRE')">Fire</button>
            <button class="btn-e" onclick="triggerRemoteSiren('MEDICAL')">Medical</button>
            <button class="btn-e" onclick="triggerRemoteSiren('INTRUDER')">Intruder</button>
            <button class="btn-e" style="color:var(--warning); border-color:rgba(252,233,154,0.2)" onclick="triggerRemoteSiren('WEATHER')">Weather</button>
            <button class="btn-e" style="color:var(--accent); border-color:rgba(142,161,192,0.2)" onclick="triggerRemoteSiren('POWER OUTAGE')">Power Outage</button>
            <button class="btn btn-cancel" onclick="cancelEmergency()">🛑 ALL CLEAR</button>
        </div>
    </div>

    <div class="section">
        <span class="label">Chore Rotation</span>
        <div class="dish-box">
            <span id="dish-display">---</span>
            <button class="btn btn-sec" style="width: auto; padding: 10px 20px;" onclick="rotateDishes()">Next</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, addDoc, collection, serverTimestamp, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn3fqrdVcRnvkiX7t6TPJWrngXSrM_1p4",
            projectId: "my-a-ab8f3",
            appId: "1:65984042323:web:04a6ebadc4eb29d52c3da6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Send Text Announcement
        window.sendRemoteAlert = async () => {
            const input = document.getElementById('announceInput');
            if(!input.value.trim()) return;
            try {
                await addDoc(collection(db, "houseInfo"), {
                    title: "REMOTE ALERT",
                    text: input.value,
                    createdAt: serverTimestamp()
                });
                input.value = "";
            } catch(e) {
                console.error("Error sending announcement:", e);
            }
        };

        // 2. Tactical Trigger Siren
        window.triggerRemoteSiren = async (type) => {
            try {
                await setDoc(doc(db, "system_triggers", "current_alert"), {
                    type: type,
                    active: true,
                    cancel: false,
                    timestamp: Date.now()
                });
            } catch(e) {
                console.error("Error triggering siren:", e);
            }
        };

        // 3. Cancel Everything
        window.cancelEmergency = async () => {
            try {
                await setDoc(doc(db, "system_triggers", "current_alert"), {
                    active: false,
                    cancel: true,
                    timestamp: Date.now()
                });
            } catch(e) {
                console.error("Error canceling emergency:", e);
            }
        };

        // 4. Real-time Dish Sync
        const rota = ["BRIAN", "LOGAN", "MALAKI"];
        onSnapshot(doc(db, "settings", "dishes"), (snap) => {
            if(snap.exists()) {
                const data = snap.data();
                if(data.index !== undefined && rota[data.index]) {
                    document.getElementById('dish-display').innerText = rota[data.index];
                }
            } else {
                setDoc(doc(db, "settings", "dishes"), { index: 0 });
            }
        });

        window.rotateDishes = async () => {
            const ref = doc(db, "settings", "dishes");
            try {
                const snap = await getDoc(ref);
                if(snap.exists()) {
                    const currentIndex = snap.data().index ?? 0;
                    await updateDoc(ref, { index: (currentIndex + 1) % rota.length });
                } else {
                    await setDoc(ref, { index: 1 });
                }
            } catch(e) {
                console.error("Error updating dishes:", e);
            }
        };
    </script>
</body>
</html>
