<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Westlake Elite · Screensaver</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{
    height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  body.hidecursor{cursor:none}

  #stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;z-index:1}
  .slide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    will-change:transform,opacity;transform:translate3d(0,0,0);backface-visibility:hidden;
  }
  .media{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    will-change:transform;transform-origin:center center;
  }
  .media img,.media video{
    width:100%;height:100%;display:block;transform-origin:center center;
    will-change:transform;backface-visibility:hidden;
    user-select:none;-webkit-user-drag:none;
  }
  .fit-cover .media img,.fit-cover .media video{object-fit:cover}
  .fit-contain .media img,.fit-contain .media video{object-fit:contain}

  @keyframes kbA{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.16) translate3d(-1.6%,-1.3%,0)}}
  @keyframes kbB{from{transform:scale(1.14) translate3d(1.5%,1.1%,0)}to{transform:scale(1.0) translate3d(0,0,0)}}
  .media.kb{animation-timing-function:linear;animation-fill-mode:both}

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(125% 105% at 50% 45%,transparent 42%,rgba(0,0,0,.5) 100%);
  }

  /* ---------- loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:80;display:grid;place-items:center;
    background:radial-gradient(80% 80% at 50% 40%,#101014,#000);
    transition:opacity .6s ease;
  }
  #loader.hidden{opacity:0;pointer-events:none}
  .loader-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
  .brand{
    display:inline-flex;align-items:center;gap:10px;
    font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.8);
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,#f6dd8f,#c99a2e);
    box-shadow:0 0 16px rgba(230,186,88,.9);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
  .ring{
    width:38px;height:38px;border-radius:50%;
    border:2px solid rgba(255,255,255,.12);
    border-top-color:rgba(233,200,108,.9);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loaderText{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.08em}

  /* ---------- top bar ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    padding:18px 22px;padding-top:calc(18px + env(safe-area-inset-top));
    transition:opacity .6s ease,transform .6s ease;
  }
  #watermark{
    display:flex;align-items:center;gap:9px;
    font-size:13.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.93);user-select:none;
    text-shadow:0 2px 16px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.6);
  }
  #watermark .dot{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#f6dd8f,#c99a2e);
    box-shadow:0 0 14px rgba(230,186,88,.8);
  }
  #gear{
    width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    color:#fff;cursor:pointer;padding:0;
    backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
    transition:transform .45s cubic-bezier(.22,.61,.36,1),background .25s ease,box-shadow .3s ease;
    box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  #gear:hover{background:rgba(255,255,255,.2);transform:rotate(60deg) scale(1.07);box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #gear:active{transform:rotate(60deg) scale(.95)}
  #gear svg{width:20px;height:20px}

  #hud{
    position:fixed;left:0;bottom:0;z-index:30;padding:16px 22px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;gap:16px;align-items:baseline;pointer-events:none;
    font-size:12.5px;letter-spacing:.05em;color:rgba(255,255,255,.7);
    text-shadow:0 1px 12px rgba(0,0,0,.9);
    transition:opacity .6s ease;
  }
  #hudName{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hudCount{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.5)}

  #progress{
    position:fixed;left:0;right:0;bottom:0;height:2px;z-index:31;
    background:rgba(255,255,255,.07);transition:opacity .6s ease;
  }
  #progressBar{
    height:100%;width:0;
    background:linear-gradient(90deg,#e9c86c,#c99a2e);
    box-shadow:0 0 12px rgba(230,186,88,.65);
  }

  body.ui-hidden #topbar{opacity:0;transform:translateY(-8px);pointer-events:none}
  body.ui-hidden #hud{opacity:0}
  body.ui-hidden #progress{opacity:0}

  #scrim{
    position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);
    opacity:1;transition:opacity .45s ease;backdrop-filter:blur(2px);
  }
  #scrim.hidden{opacity:0;pointer-events:none}

  #panel{
    position:fixed;top:0;right:0;height:100%;z-index:60;
    width:min(390px,94vw);
    display:flex;flex-direction:column;
    background:rgba(15,15,18,.82);
    backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
    border-left:1px solid rgba(255,255,255,.08);
    box-shadow:-40px 0 100px rgba(0,0,0,.7);
    transform:translateX(102%);
    transition:transform .5s cubic-bezier(.22,.61,.36,1);
    color:#f0f0f3;
  }
  #panel.open{transform:translateX(0)}

  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 14px;padding-top:calc(20px + env(safe-area-inset-top));
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .panel-head h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
  #panelClose{
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:14px;line-height:1;
    display:grid;place-items:center;transition:background .2s ease,transform .2s ease;
  }
  #panelClose:hover{background:rgba(255,255,255,.16);transform:scale(1.06)}

  .panel-body{flex:1;overflow-y:auto;padding:6px 20px 40px;scrollbar-width:thin}
  .panel-body::-webkit-scrollbar{width:8px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}

  .group{margin-top:22px}
  .group-title{
    font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.4);margin-bottom:10px;
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:11px 0;font-size:14px;color:rgba(255,255,255,.9);
    border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;
  }
  .row:last-child{border-bottom:none}
  .row .val{display:flex;align-items:center;gap:10px;flex:none}
  .row output{font-size:12px;color:rgba(255,255,255,.5);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

  select{
    background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13);
    border-radius:9px;padding:7px 10px;font-size:13px;outline:none;cursor:pointer;font-family:inherit;
  }
  select option{background:#1a1a1e;color:#fff}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:118px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.18);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.5);cursor:pointer;
    transition:box-shadow .2s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 6px rgba(233,200,108,.25),0 2px 6px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:#fff;cursor:pointer}

  .switch{
    -webkit-appearance:none;appearance:none;width:44px;height:26px;border-radius:99px;flex:none;
    background:rgba(255,255,255,.14);position:relative;cursor:pointer;margin:0;
    transition:background .28s ease;
  }
  .switch::after{
    content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:transform .32s cubic-bezier(.22,.61,.36,1);
  }
  .switch:checked{background:linear-gradient(135deg,#e9c86c,#c99a2e)}
  .switch:checked::after{transform:translateX(18px)}

  .row-col{padding:12px 0}
  .muted{font-size:12.5px;color:rgba(255,255,255,.45);margin-bottom:10px}

  textarea{
    width:100%;height:120px;resize:vertical;border-radius:12px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);
    color:#e9e9ee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;padding:11px;outline:none;
    transition:border-color .25s ease,background .25s ease;
  }
  textarea:focus{border-color:rgba(233,200,108,.6);background:rgba(255,255,255,.07)}

  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{
    flex:1 1 auto;min-width:96px;padding:10px 14px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);
    color:#fff;font-size:13px;font-weight:500;font-family:inherit;
    transition:background .2s ease,transform .15s ease,border-color .2s ease;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.24)}
  .btn:active{transform:scale(.975)}
  .btn.primary{background:linear-gradient(135deg,#e9c86c,#c99a2e);border-color:transparent;color:#1a1408;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}

  #toast{
    position:fixed;left:50%;bottom:42px;transform:translate(-50%,16px);
    z-index:90;padding:11px 20px;border-radius:99px;
    background:rgba(20,20,24,.92);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(16px);font-size:13px;color:#fff;
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 12px 40px rgba(0,0,0,.6);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    #watermark{font-size:11.5px;letter-spacing:.13em}
    #gear{width:38px;height:38px}
    #hudName{max-width:60vw}
    input[type=range]{width:96px}
  }
</style>
</head>

</div>

<div id="hud"><span id="hudName"></span><span id="hudCount"></span></div>
<div id="progress"><div id="progressBar"></div></div>

<div id="scrim" class="hidden"></div>

<div id="panel" role="dialog" aria-label="Settings">
  <div class="panel-head">
    <h2>Settings</h2>
    <button id="panelClose" aria-label="Close">✕</button>
  </div>
  <div class="panel-body">

    <div class="group">
      <div class="group-title">Playback</div>

      <label class="row">
        <span>Slide duration</span>
        <span class="val"><input type="range" id="sInterval" min="1" max="60" step="1"><output id="oInterval"></output></span>
      </label>

      <label class="row">
        <span>Transition</span>
        <select id="sTransition">
          <option value="fade">Fade</option>
          <option value="slide">Slide</option>
          <option value="zoom">Zoom</option>
          <option value="random">Random</option>
          <option value="none">None (instant)</option>
        </select>
      </label>

      <label class="row">
        <span>Transition speed</span>
        <span class="val"><input type="range" id="sDuration" min="0" max="2500" step="50"><output id="oDuration"></output></span>
      </label>

      <label class="row"><span>Shuffle</span><input type="checkbox" id="sShuffle" class="switch"></label>
      <label class="row"><span>Ken Burns motion</span><input type="checkbox" id="sKen" class="switch"></label>

      <label class="row">
        <span>Fit mode</span>
        <select id="sFit">
          <option value="cover">Fill screen</option>
          <option value="contain">Fit whole</option>
        </select>
      </label>
    </div>

    <div class="group">
      <div class="group-title">Video</div>
      <label class="row"><span>Play sound</span><input type="checkbox" id="sSound" class="switch"></label>
      <label class="row"><span>Loop videos</span><input type="checkbox" id="sLoop" class="switch"></label>
      <label class="row"><span>Advance when video ends</span><input type="checkbox" id="sAdvance" class="switch"></label>
    </div>

    <div class="group">
      <div class="group-title">Interface</div>
      <label class="row"><span>Watermark</span><input type="checkbox" id="sWm" class="switch"></label>
      <label class="row"><span>Show info overlay</span><input type="checkbox" id="sHud" class="switch"></label>
      <label class="row"><span>Auto-hide controls</span><input type="checkbox" id="sAutohide" class="switch"></label>
      <label class="row">
        <span>Preload ahead</span>
        <span class="val"><input type="range" id="sPreload" min="1" max="30" step="1"><output id="oPreload"></output></span>
      </label>
    </div>

    <div class="group">
      <div class="group-title">Playlist</div>
      <div class="row-col">
        <div class="muted" id="listInfo">—</div>
        <textarea id="sUrls" spellcheck="false" placeholder="One URL per line…"></textarea>
        <div class="btn-row">
          <button id="btnApply" class="btn primary">Apply URLs</button>
          <button id="btnDefaultList" class="btn">Default list</button>
          <button id="btnShuffleNow" class="btn">Shuffle now</button>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">Actions</div>
      <div class="btn-row">
        <button id="btnFull" class="btn">Fullscreen</button>
        <button id="btnReset" class="btn">Reset zoom</button>
        <button id="btnPreload" class="btn">Preload now</button>
        <button id="btnDefaults" class="btn">Restore defaults</button>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

/* =====================================================================
   PARSE
   ===================================================================== */
function baseName(p){
  const parts = p.split('/').filter(Boolean);
  let last = parts[parts.length - 1] || '';
  if(last.toLowerCase() === 'ik-video.mp4') last = parts[parts.length - 2] || last;
  try{ last = decodeURIComponent(last); }catch(e){}
  return last.replace(/\.[a-z0-9]+$/i, '');
}
function normalize(raw){
  const s = String(raw || '').trim();
  if(!/^https?:\/\//i.test(s)) return null;
  const qIdx = s.indexOf('?');
  const path = qIdx === -1 ? s : s.slice(0, qIdx);
  const query = qIdx === -1 ? '' : s.slice(qIdx);
  if(/\/ik-video\.mp4$/i.test(path))  return { url: s, type: 'video', name: baseName(path) };
  if(/\.mov$/i.test(path))            return { url: path + '/ik-video.mp4', type: 'video', name: baseName(path) };
  if(/\.(mp4|m4v|webm|ogv)$/i.test(path)) return { url: s, type: 'video', name: baseName(path) };
  if(/\.heic$/i.test(path))           return { url: s, type: 'image', name: baseName(path), fallback: path + (query ? query + '&' : '?') + 'tr=f-jpg' };
  return { url: s, type: 'image', name: baseName(path) };
}
function parseList(text){
  const seen = new Set(), out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const raw = line.trim();
    if(!raw || !/^https?:\/\//i.test(raw)) return;
    const it = normalize(raw);
    if(!it || seen.has(it.url)) return;
    seen.add(it.url);
    out.push(it);
  });
  return out;
}

/* =====================================================================
   PRELOAD MANAGER
   ===================================================================== */
const imgCache = new Map();          // url -> Image
const vidCache = new Map();          // url -> HTMLVideoElement
let preloadQueue = [];
let preloadRunning = false;
let preloadGeneration = 0;

function preloadImage(url){
  if(imgCache.has(url)) return;
  const img = new Image();
  img.decoding = 'async';
  img.src = url;
  imgCache.set(url, img);
  if(imgCache.size > 200){
    const k = imgCache.keys().next().value;
    imgCache.delete(k);
  }
}
function preloadVideo(url){
  if(vidCache.has(url)) return;
  const v = document.createElement('video');
  v.preload = 'auto';
  v.muted = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.src = url;
  try{ v.load(); }catch(e){}
  vidCache.set(url, v);
  if(vidCache.size > 6){
    const k = vidCache.keys().next().value;
    const old = vidCache.get(k);
    vidCache.delete(k);
    if(old){ try{ old.removeAttribute('src'); old.load(); }catch(e){} }
  }
}

function runPreloadQueue(){
  if(preloadRunning) return;
  preloadRunning = true;
  const gen = preloadGeneration;
  const step = () => {
    if(gen !== preloadGeneration){ preloadRunning = false; preloadQueue = []; return; }
    const job = preloadQueue.shift();
    if(!job){ preloadRunning = false; return; }
    try{ job(); }catch(e){}
    setTimeout(step, 40);
  };
  step();
}

function preloadAround(){
  const n = playlist.length;
  if(!n) return;
  preloadGeneration++;
  preloadQueue = [];

  const count = Math.max(1, Math.min(CFG.preload, n - 1));
  let imgCount = 0, vidCount = 0;

  for(let k = 1; k <= count; k++){
    const it = playlist[(index + k) % n];
    if(!it) continue;
    if(it.type === 'image'){
      if(imgCount++ < 40) preloadQueue.push(() => preloadImage(it.url));
    } else {
      if(vidCount++ < 2) preloadQueue.push(() => preloadVideo(it.url));
    }
  }
  // previous image too
  const prevIt = playlist[(index - 1 + n) % n];
  if(prevIt && prevIt.type === 'image') preloadQueue.push(() => preloadImage(prevIt.url));

  runPreloadQueue();
  updateLoaderText();
}

function updateLoaderText(){
  const c = imgCache.size + vidCache.size;
  loaderText.textContent = 'Preloading media… (' + c + ' cached)';
}

/* =====================================================================
   SLIDESHOW
   ===================================================================== */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildPlaylist(keepIndex){
  const cur = playlist[index];
  playlist = CFG.shuffle ? shuffleArray(allItems) : allItems.slice();
  if(keepIndex && cur){
    const i = playlist.indexOf(cur);
    index = i >= 0 ? i : 0;
  } else {
    index = 0;
  }
  updateListInfo();
}
function setItems(items, start){
  allItems = items;
  buildPlaylist(false);
  if(start !== false) showSlide(0, 1);
}
function updateListInfo(){
  listInfo.textContent = allItems.length
    ? allItems.length.toLocaleString() + ' items · ' +
      allItems.filter(i => i.type === 'video').length + ' videos · ' +
      allItems.filter(i => i.type === 'image').length + ' images'
    : 'No items loaded.';
}
function destroySlide(slide){
  if(!slide) return;
  slide.querySelectorAll('video').forEach(v => {
    try{ v.pause(); }catch(e){}
    v.removeAttribute('src');
    try{ v.load(); }catch(e){}
  });
  slide.remove();
}

function showSlide(i, dir){
  if(!playlist.length) return;
  const n = playlist.length;
  i = ((i % n) + n) % n;
  const item = playlist[i];
  if(!item) return;

  index = i;
  view = { s: 1, x: 0, y: 0 };

  const prevSlide = currentSlide;

  const slide = document.createElement('div');
  slide.className = 'slide fit-' + CFG.fit;

  const wrap = document.createElement('div');
  wrap.className = 'media';
  if(CFG.kenburns){
    wrap.classList.add('kb');
    wrap.style.animationName = Math.random() < 0.5 ? 'kbA' : 'kbB';
    wrap.style.animationDuration = Math.max(8000, CFG.interval * 1000 + CFG.duration + 1500) + 'ms';
  }

  let media;
  if(item.type === 'video'){
    media = document.createElement('video');
    media.playsInline = true;
    media.setAttribute('playsinline', '');
    media.setAttribute('webkit-playsinline', '');
    media.preload = 'auto';
    media.muted = !CFG.videoSound;
    media.loop = CFG.videoLoop;
    media.src = item.url;

    media.addEventListener('ended', () => {
      if(index === i && CFG.advanceOnEnd && !CFG.videoLoop) next();
    });
    media.addEventListener('error', () => {
      if(index === i) setTimeout(next, 250);
    });

    const p = media.play();
    if(p && p.catch){
      p.catch(() => { media.muted = true; media.play().catch(() => {}); });
    }
  } else {
    media = document.createElement('img');
    media.decoding = 'async';
    media.draggable = false;
    media.alt = '';
    media.addEventListener('error', () => {
      if(item.fallback && media.src.indexOf('tr=f-jpg') === -1){
        media.src = item.fallback;
      } else if(index === i){
        setTimeout(next, 200);
      }
    });
    media.src = item.url;
  }

  wrap.appendChild(media);
  slide.appendChild(wrap);

  const T = CFG.transition === 'random'
    ? ['fade', 'slide', 'zoom'][Math.floor(Math.random() * 3)]
    : CFG.transition;
  const d = CFG.duration;
  const ease = 'cubic-bezier(.22,.61,.36,1)';

  slide.style.opacity = '1';
  slide.style.transform = 'none';

  if(d > 0){
    if(T === 'fade')       slide.style.opacity = '0';
    else if(T === 'slide') slide.style.transform = 'translate3d(' + (dir * 100) + '%,0,0)';
    else if(T === 'zoom'){ slide.style.opacity = '0'; slide.style.transform = 'scale(1.12)'; }
  }

  stage.appendChild(slide);
  currentSlide = slide;
  currentMedia = media;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    slide.style.transition = 'opacity ' + d + 'ms ease, transform ' + d + 'ms ' + ease;
    slide.style.opacity = '1';
    slide.style.transform = 'none';

    if(prevSlide && prevSlide !== slide){
      prevSlide.style.transition = 'opacity ' + d + 'ms ease, transform ' + d + 'ms ' + ease;
      if(T === 'slide'){
        prevSlide.style.transform = 'translate3d(' + (-dir * 100) + '%,0,0)';
      } else if(T === 'zoom'){
        prevSlide.style.opacity = '0';
        prevSlide.style.transform = 'scale(.94)';
      } else {
        prevSlide.style.opacity = '0';
      }
      setTimeout(() => destroySlide(prevSlide), d + 140);
    }
  }));

  setTimeout(() => {
    Array.prototype.slice.call(stage.querySelectorAll('.slide')).forEach(s => {
      if(s !== currentSlide) destroySlide(s);
    });
  }, d + 400);

  renderHud();
  scheduleNext();
  startProgress();
  preloadAround();
}

function next(){ showSlide(index + 1, 1); }
function prev(){ showSlide(index - 1, -1); }

/* =====================================================================
   TIMER + PROGRESS
   ===================================================================== */
function scheduleNext(){
  clearTimeout(timer);
  timer = null;
  if(!CFG.interval || CFG.interval <= 0) return;
  const item = playlist[index];
  if(item && item.type === 'video' && CFG.advanceOnEnd && !CFG.videoLoop){
    timer = setTimeout(() => { if(!paused) next(); }, 180000);
    return;
  }
  timer = setTimeout(() => {
    if(paused){ scheduleNext(); return; }
    next();
  }, CFG.interval * 1000);
}

function startProgress(){
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
  const item = playlist[index];
  if(!item) return;
  if(item.type === 'video' && CFG.advanceOnEnd && !CFG.videoLoop) return;
  if(!CFG.interval || CFG.interval <= 0) return;
  void progressBar.offsetWidth;
  progressBar.style.transition = 'width ' + (CFG.interval * 1000) + 'ms linear';
  progressBar.style.width = '100%';
}

function renderHud(){
  const item = playlist[index];
  hudName.textContent = item ? item.name : '';
  hudCount.textContent = playlist.length ? (index + 1) + ' / ' + playlist.length : '';
}

/* =====================================================================
   ZOOM / PAN
   ===================================================================== */
function clampView(){
  if(!currentMedia) return;
  const r = stage.getBoundingClientRect();
  const maxX = Math.max(0, (view.s - 1) * r.width / 2);
  const maxY = Math.max(0, (view.s - 1) * r.height / 2);
  view.x = Math.min(maxX, Math.max(-maxX, view.x));
  view.y = Math.min(maxY, Math.max(-maxY, view.y));
}
function applyView(animate, ms){
  if(!currentMedia) return;
  if(animate){
    currentMedia.style.transition = 'transform ' + (ms || 320) + 'ms cubic-bezier(.22,.61,.36,1)';
  } else {
    currentMedia.style.transition = 'none';
  }
  currentMedia.style.transform =
    'translate3d(' + view.x + 'px,' + view.y + 'px,0) scale(' + view.s + ')';
}
function animateViewTo(s, x, y){
  view.s = s; view.x = x; view.y = y;
  clampView();
  applyView(true, 340);
}
function toggleZoom(cx, cy){
  if(view.s > 1.05){ animateViewTo(1, 0, 0); return; }
  const r = stage.getBoundingClientRect();
  const ox = cx - (r.left + r.width / 2);
  const oy = cy - (r.top + r.height / 2);
  const s = 2.6;
  animateViewTo(s, -ox * (s - 1), -oy * (s - 1));
}

/* =====================================================================
   GESTURES
   ===================================================================== */
const pts = new Map();
let drag = null;
let pinch = null;
let lastTap = 0, lastTapX = 0, lastTapY = 0;

function ptList(){ return Array.from(pts.values()); }

stage.addEventListener('pointerdown', e => {
  poke();
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pts.size === 1){
    drag = {
      startX: e.clientX, startY: e.clientY,
      t0: performance.now(),
      mode: null,
      baseX: view.x, baseY: view.y,
      moved: false,
      id: e.pointerId
    };
  } else if(pts.size === 2){
    const a = ptList();
    pinch = {
      d0: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1,
      s0: view.s, x0: view.x, y0: view.y,
      mx: (a[0].x + a[1].x) / 2,
      my: (a[0].y + a[1].y) / 2
    };
    drag = null;
    clearTimeout(timer);
    clearTimeout(hideTimer);
  }
});

stage.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(pts.size >= 2 && pinch){
    const a = ptList();
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
    const mx = (a[0].x + a[1].x) / 2;
    const my = (a[0].y + a[1].y) / 2;
    view.s = Math.min(6, Math.max(1, pinch.s0 * (d / pinch.d0)));
    view.x = pinch.x0 + (mx - pinch.mx);
    view.y = pinch.y0 + (my - pinch.my);
    clampView();
    applyView(false);
    return;
  }

  if(!drag) return;
  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;

  if(!drag.mode){
    if(Math.abs(dx) > 10 || Math.abs(dy) > 10){
      drag.mode = (view.s > 1.02) ? 'pan' : 'swipe';
      drag.moved = true;
    } else return;
  }

  if(drag.mode === 'pan'){
    view.x = drag.baseX + dx;
    view.y = drag.baseY + dy;
    clampView();
    applyView(false);
    return;
  }

  if(drag.mode === 'swipe'){
    if(Math.abs(dy) > Math.abs(dx) * 1.4) return;
    let d = dx;
    const n = playlist.length;
    if((index === 0 && d > 0 && !CFG.shuffle) ||
       (index === n - 1 && d < 0 && !CFG.shuffle)) d *= 0.32;
    if(!currentSlide) return;
    currentSlide.style.transition = 'none';
    currentSlide.style.transform = 'translate3d(' + d + 'px,0,0)';
    currentSlide.style.opacity = String(1 - Math.min(Math.abs(d) / (stage.clientWidth * 1.1), 0.55));
  }
});

function endPointer(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);

  const wasDrag = drag;
  const wasMoved = drag ? drag.moved : false;

  if(pinch && pts.size < 2){
    pinch = null;
    if(view.s < 1.06) animateViewTo(1, 0, 0);
    if(pts.size === 1){
      const p = ptList()[0];
      drag = {
        startX: p.x, startY: p.y,
        t0: performance.now(),
        mode: 'pan',
        baseX: view.x, baseY: view.y,
        moved: true,
        id: e.pointerId
      };
      return;
    }
    drag = null;
    poke();
    return;
  }

  if(wasDrag && wasDrag.mode === 'swipe' && currentSlide){
    const dx = e.clientX - wasDrag.startX;
    const dt = performance.now() - wasDrag.t0;
    const threshold = Math.min(stage.clientWidth * 0.16, 110);
    const fast = Math.abs(dx) > 45 && dt < 320;

    if(dx < -threshold || (fast && dx < 0)){ drag = null; next(); return; }
    if(dx > threshold || (fast && dx > 0)){ drag = null; prev(); return; }

    currentSlide.style.transition = 'transform .38s cubic-bezier(.22,.61,.36,1), opacity .38s ease';
    currentSlide.style.transform = 'translate3d(0,0,0)';
    currentSlide.style.opacity = '1';
  }

  if(wasDrag && wasDrag.mode === 'pan'){
    if(view.s < 1.06) animateViewTo(1, 0, 0);
  }

  if(!wasMoved){
    const now = performance.now();
    if(now - lastTap < 330 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 48){
      toggleZoom(e.clientX, e.clientY);
      lastTap = 0;
    } else {
      lastTap = now;
      lastTapX = e.clientX;
      lastTapY = e.clientY;
    }
  }

  drag = null;
  poke();
}

stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('contextmenu', e => e.preventDefault());

/* =====================================================================
   AUTO-HIDE UI
   ===================================================================== */
let hideTimer = null;
function poke(){
  document.body.classList.remove('ui-hidden');
  document.body.classList.remove('hidecursor');
  clearTimeout(hideTimer);
  if(!CFG.autohide || panelOpen) return;
  hideTimer = setTimeout(() => {
    if(panelOpen) return;
    document.body.classList.add('ui-hidden');
    document.body.classList.add('hidecursor');
  }, 4200);
}
window.addEventListener('mousemove', poke, { passive: true });
window.addEventListener('pointerdown', poke, { passive: true });
window.addEventListener('keydown', poke);
window.addEventListener('wheel', poke, { passive: true });

/* =====================================================================
   PANEL
   ===================================================================== */
function openPanel(){
  panelOpen = true;
  paused = true;
  clearTimeout(timer);
  clearTimeout(hideTimer);
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
  urlArea.value = allItems.map(i => i.url).join('\n');
  panel.classList.add('open');
  scrim.classList.remove('hidden');
  document.body.classList.remove('ui-hidden');
  document.body.classList.remove('hidecursor');
}
function closePanel(){
  panelOpen = false;
  paused = false;
  panel.classList.remove('open');
  scrim.classList.add('hidden');
  scheduleNext();
  startProgress();
  poke();
}
gearBtn.addEventListener('click', () => panelOpen ? closePanel() : openPanel());
panelClose.addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);

/* =====================================================================
   SETTINGS BINDING
   ===================================================================== */
const outInterval = document.getElementById('oInterval');
const outDuration = document.getElementById('oDuration');
const outPreload  = document.getElementById('oPreload');

function syncOutputs(){
  outInterval.textContent = CFG.interval + 's';
  outDuration.textContent = CFG.duration + 'ms';
  outPreload.textContent  = CFG.preload + '';
}

function onSettingChanged(key){
  if(key === 'watermark') watermarkEl.style.display = CFG.watermark ? '' : 'none';
  if(key === 'hud')       hud.style.display = CFG.hud ? '' : 'none';
  if(key === 'fit' && currentSlide) currentSlide.className = 'slide fit-' + CFG.fit;
  if(key === 'kenburns' && currentSlide){
    const wrap = currentSlide.querySelector('.media');
    if(wrap){
      if(CFG.kenburns){
        wrap.classList.add('kb');
        wrap.style.animationName = Math.random() < 0.5 ? 'kbA' : 'kbB';
        wrap.style.animationDuration = Math.max(8000, CFG.interval * 1000 + CFG.duration + 1500) + 'ms';
      } else {
        wrap.classList.remove('kb');
        wrap.style.animationName = '';
        wrap.style.animationDuration = '';
      }
    }
  }
  if(key === 'shuffle'){
    const cur = playlist[index];
    buildPlaylist(false);
    if(cur){ const i = playlist.indexOf(cur); index = i >= 0 ? i : 0; }
  }
  if(key === 'interval' || key === 'advanceOnEnd' || key === 'videoLoop'){
    scheduleNext();
    startProgress();
  }
  if(key === 'autohide'){
    if(!CFG.autohide){
      document.body.classList.remove('ui-hidden');
      document.body.classList.remove('hidecursor');
      clearTimeout(hideTimer);
    } else poke();
  }
  if(key === 'preload') preloadAround();
}

function bindControl(id, key, type){
  const el = document.getElementById(id);
  if(!el) return null;
  const handler = () => {
    let v;
    if(type === 'bool') v = el.checked;
    else if(type === 'num') v = parseFloat(el.value);
    else v = el.value;
    CFG[key] = v;
    saveSettings();
    syncOutputs();
    onSettingChanged(key);
  };
  el.addEventListener('input', handler);
  el.addEventListener('change', handler);
  return el;
}

const cInterval  = bindControl('sInterval', 'interval', 'num');
const cDuration  = bindControl('sDuration', 'duration', 'num');
const cPreload   = bindControl('sPreload', 'preload', 'num');
const cTransition= bindControl('sTransition', 'transition', 'str');
const cShuffle   = bindControl('sShuffle', 'shuffle', 'bool');
const cKen       = bindControl('sKen', 'kenburns', 'bool');
const cFit       = bindControl('sFit', 'fit', 'str');
const cSound     = bindControl('sSound', 'videoSound', 'bool');
const cLoop      = bindControl('sLoop', 'videoLoop', 'bool');
const cAdvance   = bindControl('sAdvance', 'advanceOnEnd', 'bool');
const cWm        = bindControl('sWm', 'watermark', 'bool');
const cHud       = bindControl('sHud', 'hud', 'bool');
const cAutohide  = bindControl('sAutohide', 'autohide', 'bool');

function applySettingsToUI(){
  if(cInterval) cInterval.value = CFG.interval;
  if(cDuration) cDuration.value = CFG.duration;
  if(cPreload)  cPreload.value  = CFG.preload;
  if(cTransition) cTransition.value = CFG.transition;
  if(cShuffle)  cShuffle.checked = CFG.shuffle;
  if(cKen)      cKen.checked = CFG.kenburns;
  if(cFit)      cFit.value = CFG.fit;
  if(cSound)    cSound.checked = CFG.videoSound;
  if(cLoop)     cLoop.checked = CFG.videoLoop;
  if(cAdvance)  cAdvance.checked = CFG.advanceOnEnd;
  if(cWm)       cWm.checked = CFG.watermark;
  if(cHud)      cHud.checked = CFG.hud;
  if(cAutohide) cAutohide.checked = CFG.autohide;
  syncOutputs();
  watermarkEl.style.display = CFG.watermark ? '' : 'none';
  hud.style.display = CFG.hud ? '' : 'none';
}

/* =====================================================================
   BUTTONS
   ===================================================================== */
document.getElementById('btnApply').addEventListener('click', () => {
  const items = parseList(urlArea.value);
  if(!items.length){ toast('No valid URLs found'); return; }
  setItems(items, true);
  toast('Loaded ' + items.length + ' items');
});

document.getElementById('btnDefaultList').addEventListener('click', () => {
  const items = parseList(EMBEDDED_URLS);
  setItems(items, true);
  urlArea.value = items.map(i => i.url).join('\n');
  toast('Default list restored (' + items.length + ')');
});

document.getElementById('btnShuffleNow').addEventListener('click', () => {
  if(!allItems.length) return;
  buildPlaylist(false);
  showSlide(0, 1);
  urlArea.value = playlist.map(i => i.url).join('\n');
  toast('Shuffled');
});

document.getElementById('btnFull').addEventListener('click', toggleFullscreen);
document.getElementById('btnReset').addEventListener('click', () => {
  animateViewTo(1, 0, 0);
  toast('Zoom reset');
});
document.getElementById('btnPreload').addEventListener('click', () => {
  preloadAround();
  toast('Preloading ahead…');
});
document.getElementById('btnDefaults').addEventListener('click', () => {
  CFG = Object.assign({}, DEFAULTS);
  saveSettings();
  applySettingsToUI();
  onSettingChanged('fit');
  onSettingChanged('kenburns');
  onSettingChanged('autohide');
  scheduleNext();
  startProgress();
  toast('Defaults restored');
});

/* =====================================================================
   FULLSCREEN
   ===================================================================== */
function toggleFullscreen(){
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(fn) fn.call(el).catch(() => {});
  } else {
    const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(fn) fn.call(document);
  }
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
window.addEventListener('keydown', e => {
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  switch(e.key){
    case 'ArrowRight': case 'PageDown': next(); e.preventDefault(); break;
    case 'ArrowLeft':  case 'PageUp':   prev(); e.preventDefault(); break;
    case ' ':           next(); e.preventDefault(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 's': case 'S': panelOpen ? closePanel() : openPanel(); break;
    case 'r': case 'R': animateViewTo(1, 0, 0); break;
    case 'Escape': if(panelOpen) closePanel(); break;
  }
});

/* =====================================================================
   TOAST
   ===================================================================== */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* =====================================================================
   BOOT  — everything from the embedded list
   ===================================================================== */
function boot(){
  const items = parseList(EMBEDDED_URLS);
  if(!items.length){
    loaderText.textContent = 'No URLs found in embedded list.';
    return;
  }

  allItems = items;
  buildPlaylist(false);
  urlArea.value = items.map(i => i.url).join('\n');
  updateListInfo();

  /* Preload the first batch BEFORE revealing, so the first swipe is instant */
  const firstBatch = Math.max(1, Math.min(CFG.preload, items.length));
  let pending = 0;

  for(let k = 0; k < firstBatch; k++){
    const it = items[k];
    if(!it || it.type !== 'image') continue;
    pending++;
    const img = new Image();
    img.decoding = 'async';
    const done = () => { pending--; if(pending <= 0) reveal(); };
    img.onload = done;
    img.onerror = done;
    img.src = it.url;
    imgCache.set(it.url, img);
  }
  /* If no images in first batch, reveal anyway after a short beat */
  if(pending === 0) setTimeout(reveal, 250);
  setTimeout(reveal, 4000); // hard safety

  function reveal(){
    if(booted) return;
    booted = true;
    loader.classList.add('hidden');
    setTimeout(() => { loader.style.display = 'none'; }, 700);
    showSlide(0, 1);
    setTimeout(poke, 800);
  }
}

applySettingsToUI();
loadFromEmbeddedAndStart();

function loadFromEmbeddedAndStart(){
  boot();
}

/* pause auto-advance when tab is hidden */
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    paused = true;
    clearTimeout(timer);
  } else if(!panelOpen){
    paused = false;
    scheduleNext();
    startProgress();
  }
});

})();
</script>
