<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060d18;
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* ---------- Backdrop gradient matching the Westlake Elite brand ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 85% 10%, rgba(20, 45, 75, 0.55) 0%, rgba(20, 45, 75, 0) 55%),
      radial-gradient(110% 90% at 8% 75%, rgba(16, 40, 70, 0.65) 0%, rgba(16, 40, 70, 0) 55%),
      linear-gradient(135deg, #0a1626 0%, #081222 45%, #060d18 100%);
    z-index: 0;
  }

  /* ---------- Slideshow layers ---------- */
  .slide {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    z-index: 1;
    background: transparent;
  }
  .slide.active { opacity: 1; }

  /* ---------- Branding (top right, like the brand image) ---------- */
  .brand {
    position: fixed;
    top: 18px;
    right: 26px;
    z-index: 50;
    color: rgba(190, 200, 212, 0.85);
    font-size: 30px;
    letter-spacing: 1px;
    font-family: Georgia, 'Times New Roman', serif;
    font-variant: small-caps;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    user-select: none;
  }
  .brand .dot { color: #9fc3e8; }

  /* ---------- Admin gear button (top right) ---------- */
  .gear-btn {
    position: fixed;
    top: 60px;
    right: 26px;
    z-index: 100;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(140, 165, 195, 0.25);
    border-radius: 50%;
    background: rgba(10, 22, 38, 0.55);
    color: rgba(190, 200, 212, 0.9);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.35;
    transition: opacity 0.25s, transform 0.3s, background 0.25s;
    backdrop-filter: blur(4px);
  }
  .gear-btn:hover, .gear-btn:focus {
    opacity: 1;
    background: rgba(20, 45, 75, 0.75);
  }
  .gear-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Admin panel ---------- */
  .admin-panel {
    position: fixed;
    top: 112px;
    right: 26px;
    z-index: 100;
    width: 300px;
    background: linear-gradient(160deg, rgba(13, 28, 48, 0.97), rgba(8, 18, 34, 0.97));
    border: 1px solid rgba(140, 165, 195, 0.22);
    border-radius: 12px;
    padding: 20px;
    color: #c3cfdd;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  .admin-panel.open { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .admin-panel h2 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9fc3e8;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(140, 165, 195, 0.18);
    padding-bottom: 10px;
    font-variant: small-caps;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(160, 175, 195, 0.8);
    margin-bottom: 6px;
  }
  .field input[type="range"] {
    width: 100%;
    accent-color: #4d7fb5;
  }
  .field .val {
    float: right;
    color: #9fc3e8;
    font-size: 12px;
  }
  .field input[type="number"] {
    width: 100%;
    background: rgba(6, 13, 24, 0.8);
    border: 1px solid rgba(140, 165, 195, 0.25);
    border-radius: 6px;
    color: #dbe4ee;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input[type="number"]:focus { outline: none; border-color: #4d7fb5; }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .toggle-row span { font-size: 13px; letter-spacing: 0.5px; }

  /* Switch */
  .switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-track {
    position: absolute;
    inset: 0;
    background: rgba(140, 165, 195, 0.2);
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.25s;
  }
  .slider-track::before {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: #9fb0c4;
    border-radius: 50%;
    transition: transform 0.25s, background 0.25s;
  }
  .switch input:checked + .slider-track { background: rgba(77, 127, 181, 0.55); }
  .switch input:checked + .slider-track::before { transform: translateX(20px); background: #cfe2f5; }

  .btn-row { display: flex; gap: 8px; margin-top: 6px; }
  .btn {
    flex: 1;
    padding: 9px 0;
    background: rgba(77, 127, 181, 0.18);
    border: 1px solid rgba(140, 165, 195, 0.3);
    border-radius: 8px;
    color: #cfe0f2;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(77, 127, 181, 0.4); }

  .status-line {
    margin-top: 14px;
    font-size: 11.5px;
    color: rgba(150, 168, 190, 0.75);
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Hint that fades away */
  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    color: rgba(160, 175, 195, 0.55);
    font-size: 13px;
    letter-spacing: 1px;
    transition: opacity 1s;
    pointer-events: none;
    font-family: Georgia, serif;
  }
</style>
</head>

<div class="backdrop"></div>

<img class="slide" id="slideA" alt="">
<img class="slide" id="slideB" alt="">

<button class="gear-btn" id="gearBtn" title="Admin panel" aria-label="Open admin panel">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div class="admin-panel" id="adminPanel">
  <h2>Admin Panel</h2>

  <div class="field">
    <label>Slide Duration <span class="val" id="durationVal">10s</span></label>
    <input type="range" id="durationSlider" min="2" max="60" step="1" value="10">
  </div>

  <div class="field">
    <label>Fade Transition <span class="val" id="fadeVal">1.2s</span></label>
    <input type="range" id="fadeSlider" min="0" max="3" step="0.1" value="1.2">
  </div>

  <div class="toggle-row">
    <span>Shuffle</span>
    <label class="switch">
      <input type="checkbox" id="shuffleToggle" checked>
      <span class="slider-track"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Pause Slideshow</span>
    <label class="switch">
      <input type="checkbox" id="pauseToggle">
      <span class="slider-track"></span>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <button class="btn" id="nextBtn">Next &#8594;</button>
  </div>
  <div class="btn-row">
    <button class="btn" id="fullscreenBtn">Fullscreen</button>
  </div>

  <div class="status-line" id="statusLine">Slide 1 of …</div>
</div>

<div class="hint" id="hint">Press <b>A</b> for admin &nbsp;·&nbsp; <b>Space</b> pause &nbsp;·&nbsp; <b>←</b>/<b>→</b> navigate &nbsp;·&nbsp; <b>F</b> fullscreen</div>

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  var settings = {
    duration: 10,   // seconds per slide
    fade: 1.2,      // crossfade seconds
    shuffle: true,
    paused: false
  };

  var order = [];          // display order (indices into IMAGES)
  var pos = 0;             // position in order
  var currentLayer = 0;    // which <img> is on top
  var timer = null;
  var failed = {};         // urls known to be broken

  var layers = [document.getElementById("slideA"), document.getElementById("slideB")];
  var statusLine = document.getElementById("statusLine");

  // ------------------------------------------------------------------
  // Helpers
  // ------------------------------------------------------------------
  function buildOrder() {
    order = IMAGES.map(function (_, i) { return i; });
    if (settings.shuffle) {
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
    }
    pos = 0;
  }

  function preload(url) {
    var img = new Image();
    img.src = url;
  }

  function showSlide(step) {
    if (!order.length) return;
    pos = (pos + step + order.length) % order.length;
    var url = IMAGES[order[pos]];
    var nextLayer = layers[1 - currentLayer];

    var onFail = function () {
      failed[url] = true;
      showSlide(step); // skip broken image
    };
    nextLayer.onerror = onFail;
    nextLayer.onload = function () {
      nextLayer.onerror = null;
      // immediately begin preloading the following image
      var nextPos = (pos + step + order.length) % order.length;
      preload(IMAGES[order[nextPos]]);
    };
    nextLayer.src = url;

    layers[currentLayer].style.opacity = 0;
    nextLayer.style.opacity = 1;
    currentLayer = 1 - currentLayer;

    statusLine.textContent = "Slide " + (pos + 1) + " of " + order.length +
      (failed[url] ? "" : "");
  }

  function schedule() {
    clearTimeout(timer);
    if (settings.paused) return;
    timer = setTimeout(function () { showSlide(1); schedule(); }, settings.duration * 1000);
  }

  function restart() {
    clearTimeout(timer);
    schedule();
  }

  // ------------------------------------------------------------------
  // Admin panel wiring
  // ------------------------------------------------------------------
  var panel = document.getElementById("adminPanel");
  var gearBtn = document.getElementById("gearBtn");

  function togglePanel(force) {
    var open = (typeof force === "boolean") ? force : !panel.classList.contains("open");
    panel.classList.toggle("open", open);
    gearBtn.classList.toggle("spin", open);
  }
  gearBtn.addEventListener("click", function (e) { e.stopPropagation(); togglePanel(); });
  document.addEventListener("click", function (e) {
    if (panel.classList.contains("open") && !panel.contains(e.target) && e.target !== gearBtn) {
      togglePanel(false);
    }
  });

  var durationSlider = document.getElementById("durationSlider");
  var durationVal = document.getElementById("durationVal");
  durationSlider.addEventListener("input", function () {
    settings.duration = parseInt(this.value, 10);
    durationVal.textContent = settings.duration + "s";
    restart();
  });

  var fadeSlider = document.getElementById("fadeSlider");
  var fadeVal = document.getElementById("fadeVal");
  fadeSlider.addEventListener("input", function () {
    settings.fade = parseFloat(this.value);
    fadeVal.textContent = settings.fade + "s";
    layers.forEach(function (l) { l.style.transition = "opacity " + settings.fade + "s ease-in-out"; });
  });

  document.getElementById("shuffleToggle").addEventListener("change", function () {
    settings.shuffle = this.checked;
    buildOrder();
    showSlide(0);
    restart();
  });

  var pauseToggle = document.getElementById("pauseToggle");
  pauseToggle.addEventListener("change", function () {
    settings.paused = this.checked;
    if (settings.paused) { clearTimeout(timer); } else { restart(); }
  });

  document.getElementById("nextBtn").addEventListener("click", function () { showSlide(1); restart(); });
  document.getElementById("prevBtn").addEventListener("click", function () { showSlide(-1); restart(); });

  document.getElementById("fullscreenBtn").addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  });

  // Keyboard shortcuts
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    switch (e.key.toLowerCase()) {
      case "a": togglePanel(); break;
      case " ": e.preventDefault(); pauseToggle.checked = !pauseToggle.checked;
        pauseToggle.dispatchEvent(new Event("change")); break;
      case "arrowright": showSlide(1); restart(); break;
      case "arrowleft": showSlide(-1); restart(); break;
      case "f": document.getElementById("fullscreenBtn").click(); break;
      case "escape": togglePanel(false); break;
    }
  });

  // Fade hint after a while
  setTimeout(function () {
    var hint = document.getElementById("hint");
    if (hint) hint.style.opacity = 0;
  }, 6000);

  // ------------------------------------------------------------------
  // Start
  // ------------------------------------------------------------------
  buildOrder();
  layers.forEach(function (l) { l.style.transition = "opacity " + settings.fade + "s ease-in-out"; });
  showSlide(0);
  schedule();
})();
</script>
</body>
</html>
